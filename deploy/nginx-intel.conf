# intel.paperstream.dev: direkt erreichbar (DNS ohne Cloudflare-Proxy), keine Zugriffsprotokolle.
# Die Absenderadresse geht nur als Header an den Dienst (Rate-Limit-Hash im RAM).
server {
    listen 80;
    listen [::]:80;
    server_name intel.paperstream.dev;
    access_log off;
    error_log /dev/null crit;
    return 301 https://intel.paperstream.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name intel.paperstream.dev;

    ssl_certificate /etc/letsencrypt/live/intel.paperstream.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intel.paperstream.dev/privkey.pem;

    access_log off;
    error_log /dev/null crit;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:5110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
